name: Aether-DCTWIN CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-physics-and-api:
    name: Backend Physics SDK, Demarcation Guardrails & API Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run pytest suite (Physics Invariants + Multi-Site Topologies + Demarcation + API)
        env:
          PYTHONPATH: backend
        run: pytest tests -v

  frontend-typecheck-and-build:
    name: Frontend TypeScript Strict Check & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check (tsc --noEmit)
        run: npx tsc --noEmit

      - name: Production Vite bundle build
        run: npm run build
